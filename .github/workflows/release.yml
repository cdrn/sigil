name: Release

# Publishes sigild to npm with a Sigstore provenance attestation. Triggered
# by a tag matching v*; the tag's version must match package.json. No
# long-lived NPM_TOKEN — authentication is GitHub Actions OIDC against a
# trusted-publisher config on npmjs.com.
#
# Maintainer flow:
#   1. bump package.json to N.N.N, commit, push to main (via PR)
#   2. git tag vN.N.N && git push --tags
#   3. this workflow runs, tests, publishes
#
# Verifying a published release (anyone):
#   npm audit signatures
#   npm view sigild@<version> dist.attestations

on:
  push:
    tags:
      - 'v*'

permissions:
  # contents: write so the job can create a GitHub Release and attach the
  # SBOM as a release asset. (Without this, gh release create returns 403.)
  contents: write
  # Required for OIDC publish + Sigstore attestation signing.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish sigild to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 24
        # Node 22 ships npm 10 which doesn't support OIDC trusted-publisher
        # auth, and `npm install -g npm@latest` to upgrade it in place is
        # broken (missing transitive deps after self-upgrade). Node 24 ships
        # npm 11.5+ directly. CI still runs on Node 22 since that matches
        # our package.json engines.node minimum.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Releasing sigild@${PKG_VERSION}"

      - name: Install dependencies
        # npm ci honors .npmrc (ignore-scripts=true) and the committed lockfile.
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm with provenance
        # No NODE_AUTH_TOKEN env var: npm 11.5+ + id-token:write permission
        # + registry-url above is what triggers OIDC publish. The
        # --provenance flag signs a Sigstore attestation linking this
        # tarball back to this workflow run + commit.
        run: npm publish --access public --provenance

      - name: Generate CycloneDX SBOM
        # Pinned via npx to keep cyclonedx-npm out of our package.json
        # devDeps. Emits the full install tree so users can audit
        # transitive deps without needing to clone + npm ci themselves.
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@4.2.1 \
            --output-format JSON \
            --output-file sigild-${{ github.ref_name }}.cdx.json

      - name: Create GitHub Release with SBOM attached
        # --generate-notes pulls auto-generated PR summary since last tag.
        # SBOM is attached as a release asset with a human-readable label.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "sigild-${GITHUB_REF_NAME}.cdx.json#CycloneDX SBOM"
