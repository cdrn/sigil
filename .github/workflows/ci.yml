name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        # npm ci honors .npmrc (ignore-scripts=true) and the lockfile.
        # The next step audits the tree for any dep declaring an install
        # hook so we notice before a fresh user (without our .npmrc)
        # would actually execute it.
        run: npm ci
      - name: Audit dep tree for install scripts
        # Fails the build if any package in node_modules declares
        # preinstall / install / postinstall. See script header for the
        # threat-model reasoning behind which hooks are checked.
        run: node scripts/check-install-scripts.mjs
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
