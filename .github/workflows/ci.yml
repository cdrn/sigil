name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        # npm ci honors .npmrc (ignore-scripts=true) and the lockfile.
        # The next step audits the tree for any dep declaring an install
        # hook so we notice before a fresh user (without our .npmrc)
        # would actually execute it.
        #
        # We wrap in a retry loop because npm registry fetches from GHA
        # runners occasionally hang silently (no output for minutes); a
        # short timeout + retry is cheaper than a 6h job-level cancel.
        # --loglevel=info surfaces the per-tarball progress so a future
        # hang has a recognizable failure mode in the log.
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::npm ci attempt ${attempt}"
            if timeout 120 npm ci --loglevel=info --no-audit --no-fund --prefer-offline; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::npm ci timed out or failed on attempt ${attempt}"
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1
      - name: Audit dep tree for install scripts
        # Fails the build if any package in node_modules declares
        # preinstall / install / postinstall. See script header for the
        # threat-model reasoning behind which hooks are checked.
        run: node scripts/check-install-scripts.mjs
      - name: Run tests
        run: npm test
