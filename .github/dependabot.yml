# Dependabot keeps two surfaces fresh:
#
#  - github-actions: our workflows pin actions to commit SHAs (supply-chain
#    posture — a moved tag can't swap the code under us). Dependabot is the
#    rotation mechanism: it PRs the new SHA + version comment together, so
#    the pins stay current without hand-resolving tags.
#
#  - npm: runtime deps are exact-pinned (no ranges) and kept deliberately
#    few; Dependabot PRs version bumps so upgrades are explicit, reviewed
#    diffs rather than silent range drift. The install-scripts CI guard and
#    lockfile-diff workflow both run on these PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: development
